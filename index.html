<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wakabaポータル</title>

<style>
body{
    font-family:sans-serif;
    max-width:700px;
    margin:auto;
    padding:20px;
    background:#f5f5f5;
}

.card{
    background:white;
    padding:15px;
    margin:10px 0;
    border-radius:10px;
    box-shadow:0 2px 5px rgba(0,0,0,.1);
}

input,button{
    padding:10px;
    margin:5px;
}

.hidden{
    display:none;
}
</style>
</head>

<body>

<div id="login">

<h1>🔐 wakabaポータル</h1>

<div class="card">
<p>合言葉を入力してください</p>

<input type="password" id="pw">
<button onclick="checkPassword()">
入室
</button>

<p id="error" style="color:red;"></p>
</div>

</div>

<div id="main" class="hidden">

<h1>📚 提出物カウントダウン</h1>

<div id="list"></div>

</div>

<script>

const PASSWORD = "wakaba2026";

function checkPassword(){

const input =
document.getElementById("pw").value;

if(input === PASSWORD){

document.getElementById("login")
.classList.add("hidden");

document.getElementById("main")
.classList.remove("hidden");

loadTasks();

}else{

document.getElementById("error")
.textContent="合言葉が違います";

}

}

function loadTasks(){

const tasks = [

{
name:"学習記録入力",
deadline:"2026-09-15"
},

{
name:"探究レポート",
deadline:"2026-09-20"
},

{
name:"模試振り返り",
deadline:"2026-09-30"
}

];

const list =
document.getElementById("list");

tasks.forEach(task=>{

const today = new Date();
const deadline = new Date(task.deadline);

const diff = Math.ceil(
(deadline - today) /
(1000*60*60*24)
);

list.innerHTML += `
<div class="card">
<h2>${task.name}</h2>
<p>締切：${task.deadline}</p>
<h3>あと ${diff} 日</h3>
</div>
`;

});

}

</script>

</body>
</html>
