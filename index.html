<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WAKABA PORTAL</title>

<style>

:root{
    --wakaba:#6d1b2e;
    --bg:#f8f8f8;
    --card:#ffffff;
    --text:#333333;
    --urgent:#b71c1c;
    --warning:#e65100;
}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:
    "Yu Gothic UI",
    "Yu Gothic",
    "Hiragino Sans",
    sans-serif;
}

.header{
    background:#ffffff;
    border-bottom:3px solid var(--wakaba);
    text-align:center;
    padding:50px 20px;
}

.header h1{
    margin:0;
    color:var(--wakaba);
    font-size:2rem;
    letter-spacing:3px;
    font-weight:600;
}

.header p{
    margin-top:10px;
    color:#777;
}

.container{
    max-width:900px;
    margin:auto;
    padding:30px 20px 70px;
}

.section-title{
    color:var(--wakaba);
    font-size:1.4rem;
    margin:0 0 20px 0;
    font-weight:600;
}

.progress-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-bottom:50px;
}

.progress-card{
    background:white;
    border-radius:20px;
    padding:35px;
    text-align:center;
    box-shadow:
    0 4px 12px rgba(0,0,0,.05);
}

.progress-title{
    color:#666;
    font-size:1rem;
    margin-bottom:15px;
}

.progress-number{
    font-size:3.5rem;
    font-weight:700;
    color:var(--wakaba);
    line-height:1;
}

.progress-unit{
    margin-top:8px;
    color:#666;
}

.task-card{
    background:white;
    border-radius:20px;
    padding:25px;
    margin-bottom:18px;
    box-shadow:
    0 4px 12px rgba(0,0,0,.05);
}

.task-title{
    font-size:1.2rem;
    font-weight:600;
    margin-bottom:15px;
}

.task-days{
    font-size:2rem;
    font-weight:700;
    color:var(--wakaba);
}

.task-deadline{
    margin-top:10px;
    color:#777;
}

.urgent{
    border-left:6px solid var(--urgent);
}

.warning{
    border-left:6px solid var(--warning);
}

.normal{
    border-left:6px solid var(--wakaba);
}

.login-wrapper{
    max-width:500px;
    margin:100px auto;
    padding:20px;
}

.login-card{
    background:white;
    border-radius:20px;
    padding:35px;
    box-shadow:
    0 4px 12px rgba(0,0,0,.08);
}

.login-title{
    text-align:center;
    color:var(--wakaba);
    margin-bottom:10px;
    font-size:1.8rem;
}

.login-subtitle{
    text-align:center;
    color:#777;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:12px;
    font-size:1rem;
    box-sizing:border-box;
    margin-bottom:15px;
}

button{
    width:100%;
    background:var(--wakaba);
    color:white;
    border:none;
    padding:12px;
    border-radius:10px;
    cursor:pointer;
    font-size:1rem;
}

button:hover{
    opacity:.9;
}

.hidden{
    display:none;
}

#error{
    text-align:center;
    color:#c62828;
    margin-top:15px;
}

.footer{
    text-align:center;
    color:#888;
    font-size:.9rem;
    padding:20px;
}

@media(max-width:700px){

    .progress-grid{
        grid-template-columns:1fr;
    }

    .progress-number{
        font-size:3rem;
    }

    .task-days{
        font-size:1.7rem;
    }
}

</style>
</head>

<body>

<div id="login">

<div class="login-wrapper">

<div class="login-card">

<div class="login-title">
WAKABA PORTAL
</div>

<div class="login-subtitle">
提出物・学習支援サイト
</div>

<input
type="password"
id="pw"
placeholder="合言葉を入力">

<button onclick="checkPassword()">
入室
</button>

<div id="error"></div>

</div>

</div>

</div>

<div id="main" class="hidden">

<div class="header">

<h1>WAKABA PORTAL</h1>

<p>提出物・学習支援サイト</p>

</div>

<div class="container">

<div id="list"></div>

</div>

<div class="footer">

Fukuoka University WAKABA High School

</div>

</div>

<script>

const PASSWORD = "wakaba2026";

function checkPassword(){

    const pw =
    document.getElementById("pw").value;

    if(pw === PASSWORD){

        document.getElementById("login")
        .classList.add("hidden");

        document.getElementById("main")
        .classList.remove("hidden");

        loadTasks();

    }else{

        document.getElementById("error")
        .textContent =
        "合言葉が違います";

    }

}

async function loadTasks(){

    const sheetId =
    "1aMZqKCpTziQJJeL30ijG9SN15gAnzdB6jwbxhrO8Kvw";

    const url =
    `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json`;

    const response =
    await fetch(url);

    const text =
    await response.text();

    const json =
    JSON.parse(text.substring(47).slice(0,-2));

    const rows =
    json.table.rows;

    const list =
    document.getElementById("list");

    let tasks = [];

    rows.forEach(row=>{

        const name =
        row.c[0]?.v;

        const deadline =
        row.c[1]?.f ||
        row.c[1]?.v;

        if(!name || !deadline) return;

        const today =
        new Date();

        const limit =
        new Date(deadline);

        const diff =
        Math.ceil(
            (limit-today)
            /(1000*60*60*24)
        );

        if(diff >= 0){

            tasks.push({
                name,
                deadline,
                diff
            });

        }

    });

    tasks.sort(
        (a,b)=>a.diff-b.diff
    );

    const today =
    new Date();

    const examDate =
    new Date("2027-01-16");

    const graduationDate =
    new Date("2027-03-02");

    const examDiff =
    Math.ceil(
        (examDate-today)
        /(1000*60*60*24)
    );

    const graduationDiff =
    Math.ceil(
        (graduationDate-today)
        /(1000*60*60*24)
    );

    list.innerHTML = `

    <h2 class="section-title">
    進路情報
    </h2>

    <div class="progress-grid">

        <div class="progress-card">

            <div class="progress-title">
            大学入学共通テストまで
            </div>

            <div class="progress-number">
            ${examDiff}
            </div>

            <div class="progress-unit">
            日
            </div>

        </div>

        <div class="progress-card">

            <div class="progress-title">
            卒業まで
            </div>

            <div class="progress-number">
            ${graduationDiff}
            </div>

            <div class="progress-unit">
            日
            </div>

        </div>

    </div>

    <h2 class="section-title">
    提出物
    </h2>

    `;

    tasks.forEach(task=>{

        let cardClass =
        "normal";

        if(task.diff <= 3){

            cardClass = "urgent";

        }else if(task.diff <= 7){

            cardClass = "warning";

        }

        list.innerHTML += `

        <div class="task-card ${cardClass}">

            <div class="task-title">
            ${task.name}
            </div>

            <div class="task-days">
            残り ${task.diff} 日
            </div>

            <div class="task
