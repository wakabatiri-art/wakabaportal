<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WAKABA PORTAL</title>

<style>

:root{
  --wakaba:#6d1b2e;
  --bg:#f6f6f6;
  --urgent:#b71c1c;
  --warning:#e65100;
}

body{
  margin:0;
  background:var(--bg);
  font-family:"Yu Gothic UI","Yu Gothic",sans-serif;
  color:#333;
}

.header{
  background:#fff;
  border-bottom:3px solid var(--wakaba);
  text-align:center;
  padding:40px 20px;
}

.header h1{
  margin:0;
  color:var(--wakaba);
  letter-spacing:3px;
}

.header p{
  color:#777;
}

.container{
  max-width:900px;
  margin:auto;
  padding:30px 20px;
}

.login{
  max-width:450px;
  margin:100px auto;
  background:#fff;
  padding:30px;
  border-radius:20px;
  box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.login h1{
  text-align:center;
  color:var(--wakaba);
}

input{
  width:100%;
  box-sizing:border-box;
  padding:12px;
  margin:10px 0;
}

button{
  width:100%;
  padding:12px;
  border:none;
  background:var(--wakaba);
  color:white;
  border-radius:10px;
  cursor:pointer;
}

.hidden{
  display:none;
}

.section-title{
  color:var(--wakaba);
  margin:30px 0 15px;
}

.top-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.top-card{
  background:white;
  padding:30px;
  border-radius:20px;
  text-align:center;
  box-shadow:0 4px 12px rgba(0,0,0,.05);
}

.top-number{
  font-size:3rem;
  font-weight:bold;
  color:var(--wakaba);
}

.task-card{
  background:white;
  padding:25px;
  border-radius:20px;
  margin-bottom:15px;
  box-shadow:0 4px 12px rgba(0,0,0,.05);
}

.task-name{
  font-size:1.2rem;
  margin-bottom:10px;
}

.task-days{
  font-size:2rem;
  font-weight:bold;
  color:var(--wakaba);
}

.task-date{
  color:#777;
}

.normal{
  border-left:6px solid var(--wakaba);
}

.warning{
  border-left:6px solid var(--warning);
}

.urgent{
  border-left:6px solid var(--urgent);
}

#error{
  color:red;
  text-align:center;
}

@media(max-width:700px){

  .top-grid{
    grid-template-columns:1fr;
  }

  .top-number{
    font-size:2.5rem;
  }

}

</style>
</head>
<body>

<div id="loginPage">

  <div class="login">

    <h1>WAKABA PORTAL</h1>

    <p style="text-align:center;">
      提出物・学習支援サイト
    </p>

    <input
      type="password"
      id="pw"
      placeholder="合言葉を入力">

    <button onclick="checkPassword()">
      入室
    </button>

    <p id="error"></p>

  </div>

</div>

<div id="mainPage" class="hidden">

  <div class="header">
    <h1>WAKABA PORTAL</h1>
    <p>提出物・学習支援サイト</p>
  </div>

  <div class="container">

    <div id="content"></div>

  </div>

</div>

<script>

const PASSWORD = "wakaba2026";

function checkPassword(){

  const pw =
  document.getElementById("pw").value;

  if(pw === PASSWORD){

    document.getElementById("loginPage")
    .classList.add("hidden");

    document.getElementById("mainPage")
    .classList.remove("hidden");

    loadTasks();

  }else{

    document.getElementById("error")
    .textContent =
    "合言葉が違います";

  }

}

async function loadTasks(){

  const sheetId =
  "1aMZqKCpTziQJJeL30ijG9SN15gAnzdB6jwbxhrO8Kvw";

  const url =
  `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json`;

  const response =
  await fetch(url);

  const text =
  await response.text();

  const json =
  JSON.parse(text.substring(47).slice(0,-2));

  const rows =
  json.table.rows;

  let tasks = [];

  rows.forEach(row => {

    const name = row.c[0]?.v;
    const deadline = row.c[1]?.f || row.c[1]?.v;

    if(!name || !deadline) return;

    const today = new Date();
    const limit = new Date(deadline);

    const diff =
    Math.ceil(
      (limit - today)
      /(1000*60*60*24)
    );

    if(diff >= 0){

      tasks.push({
        name,
        deadline,
        diff
      });

    }

  });

  tasks.sort((a,b)=>a.diff-b.diff);

  const today =
  new Date();

  const examDate =
  new Date("2027-01-16");

  const graduationDate =
  new Date("2027-03-02");

  const examDiff =
  Math.ceil(
    (examDate-today)
    /(1000*60*60*24)
  );

  const graduationDiff =
  Math.ceil(
    (graduationDate-today)
    /(1000*60*60*24)
  );

  const content =
  document.getElementById("content");

  content.innerHTML = `

  <h2 class="section-title">進路情報</h2>

  <div class="top-grid">

    <div class="top-card">
      <div>大学入学共通テストまで</div>
      <div class="top-number">${examDiff}</div>
      <div>日</div>
    </div>

    <div class="top-card">
      <div>卒業まで</div>
      <div class="top-number">${graduationDiff}</div>
      <div>日</div>
    </div>

  </div>

  <h2 class="section-title">提出物</h2>

  `;

  tasks.forEach(task => {

    let css = "normal";

    if(task.diff <= 3){
      css = "urgent";
    }else if(task.diff <= 7){
      css = "warning";
    }

    content.innerHTML += `

      <div class="task-card ${css}">

        <div class="task-name">
          ${task.name}
        </div>

        <div class="task-days">
          残り ${task.diff} 日
        </div>

        <div class="task-date">
          締切：${task.deadline}
        </div>

      </div>

    `;

  });

}

</script>

</body>
</html>
