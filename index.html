<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WAKABA PORTAL</title>

<style>

body{
    font-family:"Yu Gothic UI","Yu Gothic",sans-serif;
    background:#f7f7f7;
    margin:0;
}

.login{
    max-width:400px;
    margin:100px auto;
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
}

h1{
    text-align:center;
    color:#6d1b2e;
}

input{
    width:100%;
    box-sizing:border-box;
    padding:12px;
    margin:10px 0;
}

button{
    width:100%;
    padding:12px;
    border:none;
    background:#6d1b2e;
    color:white;
    border-radius:10px;
}

#error{
    color:red;
    text-align:center;
}

.hidden{
    display:none;
}

.header{
    text-align:center;
    padding:40px;
    border-bottom:3px solid #6d1b2e;
    background:white;
}

</style>
</head>

<body>

<div id="loginPage">

<div class="login">

<h1>WAKABA PORTAL</h1>

<input
type="password"
id="pw"
placeholder="合言葉を入力">

<button onclick="checkPassword()">
入室
</button>

<p id="error"></p>

</div>

</div>

<div id="mainPage" class="hidden">

<div class="header">

<h1>WAKABA PORTAL</h1>

<p>ログイン成功</p>

</div>

</div>

<script>

function checkPassword(){

    const pw =
    document.getElementById("pw").value;

    if(pw === "wakaba2026"){

        document.getElementById("loginPage")
        .classList.add("hidden");

        document.getElementById("mainPage")
        .classList.remove("hidden");

    }else{

        document.getElementById("error")
        .textContent =
        "合言葉が違います";

    }

}

</script>

</body>
</html>
