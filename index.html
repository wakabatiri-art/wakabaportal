<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#651a2b">
<title>WAKABA PORTAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --maroon: #651a2b;
  --maroon-dark: #46101d;
  --maroon-light: #8a3447;
  --ink: #242126;
  --muted: #716b70;
  --line: #e7e1e3;
  --paper: #ffffff;
  --background: #f5f2f3;
  --urgent: #a52a2a;
  --warning: #a66a18;
  --shadow: 0 16px 40px rgba(52, 24, 32, 0.08);
}

* { box-sizing: border-box; }

html { min-height: 100%; }

body {
  min-height: 100vh;
  margin: 0;
  color: var(--ink);
  background:
    linear-gradient(180deg, rgba(101, 26, 43, 0.035), transparent 260px),
    var(--background);
  font-family: "BIZ UDPGothic", "BIZ UDゴシック", "Yu Gothic UI", "Yu Gothic", sans-serif;
  -webkit-font-smoothing: antialiased;
}

button, input { font: inherit; }

.hidden { display: none !important; }

.login-page {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 28px 18px;
}

.login-panel {
  width: min(100%, 460px);
  padding: 42px 36px;
  background: rgba(255,255,255,0.96);
  border: 1px solid var(--line);
  border-top: 5px solid var(--maroon);
  box-shadow: var(--shadow);
}

.brand {
  margin: 0;
  color: var(--maroon);
  font-family: "BIZ UDPGothic", "BIZ UDゴシック", "Yu Gothic UI", "Yu Gothic", sans-serif;
  font-size: clamp(1.85rem, 7vw, 2.4rem);
  font-weight: 600;
  letter-spacing: 0.10em;
  text-align: center;
}

.login-description {
  margin: 12px 0 32px;
  color: var(--muted);
  text-align: center;
  font-size: 0.95rem;
}

.field-label {
  display: block;
  margin-bottom: 8px;
  color: var(--ink);
  font-size: 0.9rem;
  font-weight: 600;
}

.password-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px;
}

.password-input {
  width: 100%;
  min-height: 50px;
  padding: 12px 14px;
  border: 1px solid #cfc5c8;
  border-radius: 4px;
  background: #fff;
  color: var(--ink);
  outline: none;
}

.password-input:focus {
  border-color: var(--maroon);
  box-shadow: 0 0 0 3px rgba(101, 26, 43, 0.1);
}

.toggle-button {
  min-width: 72px;
  border: 1px solid #cfc5c8;
  border-radius: 4px;
  background: #faf8f8;
  color: var(--ink);
  cursor: pointer;
}

.enter-button {
  width: 100%;
  min-height: 50px;
  margin-top: 18px;
  border: 0;
  border-radius: 4px;
  background: var(--maroon);
  color: #fff;
  font-weight: 700;
  letter-spacing: 0.08em;
  cursor: pointer;
  transition: background 0.2s ease, transform 0.2s ease;
}

.enter-button:hover { background: var(--maroon-dark); }
.enter-button:active { transform: translateY(1px); }
.enter-button:disabled { opacity: 0.65; cursor: wait; }

.message {
  min-height: 1.5em;
  margin: 14px 0 0;
  color: var(--urgent);
  text-align: center;
  font-size: 0.9rem;
}

.site-header {
  background: var(--paper);
  border-top: 7px solid var(--maroon);
  border-bottom: 1px solid var(--line);
}

.header-inner {
  width: min(1080px, calc(100% - 40px));
  margin: 0 auto;
  padding: 30px 0 26px;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
}

.site-title {
  margin: 0;
  color: var(--maroon);
  font-family: "BIZ UDPGothic", "BIZ UDゴシック", "Yu Gothic UI", "Yu Gothic", sans-serif;
  font-size: clamp(1.6rem, 5vw, 2.25rem);
  font-weight: 600;
  letter-spacing: 0.09em;
}

.site-description {
  margin: 8px 0 0;
  color: var(--muted);
  font-size: 0.9rem;
}

.updated-at {
  margin: 0;
  color: var(--muted);
  font-size: 0.82rem;
  white-space: nowrap;
}

.main-container {
  width: min(1080px, calc(100% - 40px));
  margin: 0 auto;
  padding: 44px 0 72px;
}

.section { margin-top: 48px; }
.section:first-child { margin-top: 0; }

.section-heading {
  display: flex;
  align-items: center;
  gap: 16px;
  margin: 0 0 20px;
  color: var(--maroon);
  font-size: 1.15rem;
  font-weight: 700;
  letter-spacing: 0.08em;
}

.section-heading::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--line);
}

.milestone-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 18px;
}

.milestone-card {
  position: relative;
  overflow: hidden;
  min-height: 190px;
  padding: 30px;
  background: linear-gradient(145deg, var(--maroon-dark), var(--maroon));
  color: #fff;
  box-shadow: var(--shadow);
}

.milestone-card.secondary {
  background: linear-gradient(145deg, #3d3538, #665a5f);
}

.milestone-card::after {
  content: "";
  position: absolute;
  right: -55px;
  bottom: -95px;
  width: 190px;
  height: 190px;
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 50%;
}

.milestone-label {
  position: relative;
  z-index: 1;
  margin: 0;
  font-size: 1rem;
  font-weight: 600;
  letter-spacing: 0.04em;
}

.milestone-count {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-top: 28px;
}

.milestone-number {
  font-family: "BIZ UDPGothic", "BIZ UDゴシック", "Yu Gothic UI", "Yu Gothic", sans-serif;
  font-size: clamp(3.5rem, 10vw, 5.4rem);
  line-height: 0.95;
}

.milestone-unit { font-size: 1rem; }

.milestone-date {
  position: relative;
  z-index: 1;
  margin: 18px 0 0;
  color: rgba(255,255,255,0.78);
  font-size: 0.86rem;
}

.notice-card {
  padding: 25px 28px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-left: 5px solid var(--maroon);
  box-shadow: 0 8px 26px rgba(52, 24, 32, 0.045);
}

.notice-text {
  margin: 0;
  line-height: 1.9;
  white-space: pre-wrap;
}

.task-list {
  display: grid;
  gap: 12px;
}

.task-card {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 24px;
  padding: 23px 26px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-left: 5px solid var(--maroon);
  box-shadow: 0 8px 26px rgba(52, 24, 32, 0.045);
}

.task-card.warning { border-left-color: var(--warning); }
.task-card.urgent { border-left-color: var(--urgent); }

.task-name {
  margin: 0;
  font-size: 1.08rem;
  font-weight: 700;
  line-height: 1.5;
}

.task-deadline {
  margin: 8px 0 0;
  color: var(--muted);
  font-size: 0.88rem;
}

.task-remaining {
  color: var(--maroon);
  text-align: right;
  white-space: nowrap;
}

.task-card.warning .task-remaining { color: var(--warning); }
.task-card.urgent .task-remaining { color: var(--urgent); }

.task-number {
  font-family: "BIZ UDPGothic", "BIZ UDゴシック", "Yu Gothic UI", "Yu Gothic", sans-serif;
  font-size: 2.5rem;
  font-weight: 600;
}

.task-unit { margin-left: 4px; font-size: 0.9rem; }

.empty-state, .loading-state, .error-card {
  padding: 28px;
  background: var(--paper);
  border: 1px solid var(--line);
  color: var(--muted);
  text-align: center;
}

.error-card {
  border-left: 5px solid var(--urgent);
  color: var(--urgent);
  text-align: left;
}

.site-footer {
  padding: 26px 20px 34px;
  border-top: 1px solid var(--line);
  background: #eee9eb;
  color: var(--muted);
  text-align: center;
  font-size: 0.8rem;
}

@media (max-width: 720px) {
  .login-panel { padding: 34px 24px; }
  .header-inner { align-items: flex-start; flex-direction: column; }
  .milestone-grid { grid-template-columns: 1fr; }
  .milestone-card { min-height: 170px; }
  .task-card { grid-template-columns: 1fr; gap: 18px; }
  .task-remaining { text-align: left; }
  .main-container { width: min(100% - 28px, 1080px); padding-top: 30px; }
}
</style>
</head>
<body>

<section id="loginPage" class="login-page" aria-labelledby="loginTitle">
  <div class="login-panel">
    <h1 id="loginTitle" class="brand">WAKABA PORTAL</h1>
    <p class="login-description">提出物・学習支援サイト</p>

    <label class="field-label" for="pw">合言葉</label>
    <div class="password-row">
      <input id="pw" class="password-input" type="password" autocomplete="current-password" placeholder="合言葉を入力">
      <button id="togglePassword" class="toggle-button" type="button">表示</button>
    </div>
    <button id="loginButton" class="enter-button" type="button">入室</button>
    <p id="loginMessage" class="message" role="alert"></p>
  </div>
</section>

<div id="mainPage" class="hidden">
  <header class="site-header">
    <div class="header-inner">
      <div>
        <h1 class="site-title">WAKABA PORTAL</h1>
        <p class="site-description">提出物・学習支援サイト</p>
      </div>
      <p id="updatedAt" class="updated-at"></p>
    </div>
  </header>

  <main class="main-container">
    <section class="section" aria-labelledby="milestoneHeading">
      <h2 id="milestoneHeading" class="section-heading">大切な日まで</h2>
      <div class="milestone-grid">
        <article class="milestone-card">
          <p class="milestone-label">大学入学共通テストまで</p>
          <div class="milestone-count">
            <span id="examDays" class="milestone-number">--</span>
            <span class="milestone-unit">日</span>
          </div>
          <p id="examDateLabel" class="milestone-date"></p>
        </article>

        <article class="milestone-card secondary">
          <p class="milestone-label">卒業まで</p>
          <div class="milestone-count">
            <span id="graduationDays" class="milestone-number">--</span>
            <span class="milestone-unit">日</span>
          </div>
          <p id="graduationDateLabel" class="milestone-date"></p>
        </article>
      </div>
    </section>

    <section id="noticeSection" class="section hidden" aria-labelledby="noticeHeading">
      <h2 id="noticeHeading" class="section-heading">お知らせ</h2>
      <div class="notice-card">
        <p id="noticeText" class="notice-text"></p>
      </div>
    </section>

    <section class="section" aria-labelledby="taskHeading">
      <h2 id="taskHeading" class="section-heading">提出物</h2>
      <div id="taskList" class="task-list">
        <div class="loading-state">提出物を読み込んでいます。</div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    個人運営の学習支援ページです。学校公式サイトではありません。
  </footer>
</div>

<script>
"use strict";

const SHEET_ID = "1aMZqKCpTziQJJeL30ijG9SN15gAnzdB6jwbxhrO8Kvw";
const TASK_SHEET_GID = "0";
const SETTINGS_SHEET_GID = "1806886382";

const state = {
  password: "",
  examDate: "",
  graduationDate: "",
  notice: ""
};

const loginButton = document.getElementById("loginButton");
const passwordInput = document.getElementById("pw");
const loginMessage = document.getElementById("loginMessage");
const togglePassword = document.getElementById("togglePassword");

loginButton.addEventListener("click", checkPassword);
passwordInput.addEventListener("keydown", event => {
  if (event.key === "Enter") checkPassword();
});

togglePassword.addEventListener("click", () => {
  const hidden = passwordInput.type === "password";
  passwordInput.type = hidden ? "text" : "password";
  togglePassword.textContent = hidden ? "非表示" : "表示";
});

function gvizUrl(gid, headers) {
  return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${gid}&headers=${headers}&tqx=out:json`;
}

async function fetchGviz(gid, headers) {
  const response = await fetch(gvizUrl(gid, headers), { cache: "no-store" });
  if (!response.ok) throw new Error(`データ取得エラー: ${response.status}`);

  const text = await response.text();
  const start = text.indexOf("{");
  const end = text.lastIndexOf("}");
  if (start < 0 || end < 0) throw new Error("スプレッドシートの応答を読み取れませんでした。");

  const data = JSON.parse(text.slice(start, end + 1));
  if (data.status === "error") throw new Error("スプレッドシートの設定を確認してください。");
  return data;
}

function cellValue(cell) {
  if (!cell) return "";
  if (cell.f !== undefined && cell.f !== null) return String(cell.f).trim();
  if (cell.v !== undefined && cell.v !== null) return String(cell.v).trim();
  return "";
}

function normalizeKey(value) {
  return value.replace(/[\s　]/g, "").trim();
}

function normalizeDateValue(value) {
  const text = String(value || "").trim();
  const gvizDate = text.match(/^Date\((\d{4}),(\d{1,2}),(\d{1,2})\)$/);
  if (gvizDate) {
    const year = gvizDate[1];
    const month = String(Number(gvizDate[2]) + 1).padStart(2, "0");
    const day = String(gvizDate[3]).padStart(2, "0");
    return `${year}-${month}-${day}`;
  }

  const match = text.match(/(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/);
  if (match) {
    return `${match[1]}-${String(match[2]).padStart(2, "0")}-${String(match[3]).padStart(2, "0")}`;
  }
  return text;
}

function parseLocalDate(value) {
  const normalized = normalizeDateValue(value);
  const match = normalized.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!match) return null;
  return new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]), 23, 59, 59, 999);
}

function startOfToday() {
  const now = new Date();
  return new Date(now.getFullYear(), now.getMonth(), now.getDate());
}

function daysUntil(date) {
  const targetDay = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  return Math.ceil((targetDay - startOfToday()) / 86400000);
}

function formatJapaneseDate(date) {
  return new Intl.DateTimeFormat("ja-JP", {
    year: "numeric",
    month: "long",
    day: "numeric",
    weekday: "short"
  }).format(date);
}

function escapeHtml(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

async function loadSettings() {
  const data = await fetchGviz(SETTINGS_SHEET_GID, 0);
  const values = {};

  // 通常はA列を項目名、B列を値として読み込みます。
  for (const row of data.table.rows || []) {
    const key = normalizeKey(cellValue(row.c?.[0]));
    const value = cellValue(row.c?.[1]);
    if (key) values[key] = value;
  }

  // Google側が1行目を見出しと判断した場合にも対応します。
  const firstLabel = normalizeKey(String(data.table.cols?.[0]?.label || ""));
  const secondLabel = String(data.table.cols?.[1]?.label || "").trim();
  if (firstLabel && secondLabel && !values[firstLabel]) {
    values[firstLabel] = secondLabel;
  }

  state.password = String(values["パスワード"] || "").trim();
  state.examDate = normalizeDateValue(values["共通テスト"] || "");
  state.graduationDate = normalizeDateValue(values["卒業式"] || "");
  state.notice = values["お知らせ"] || "";

  if (!state.password) {
    throw new Error("設定シートの「パスワード」を読み取れませんでした。");
  }
}

async function checkPassword() {
  loginMessage.textContent = "";
  loginButton.disabled = true;
  loginButton.textContent = "確認中";

  try {
    await loadSettings();

    if (passwordInput.value !== state.password) {
      loginMessage.textContent = "合言葉が違います。";
      return;
    }

    document.getElementById("loginPage").classList.add("hidden");
    document.getElementById("mainPage").classList.remove("hidden");
    await loadPortal();
  } catch (error) {
    console.error(error);
    loginMessage.textContent = `設定を読み込めませんでした。${error.message}`;
  } finally {
    loginButton.disabled = false;
    loginButton.textContent = "入室";
  }
}

async function loadPortal() {
  renderMilestones();
  renderNotice();
  await loadTasks();

  document.getElementById("updatedAt").textContent =
    `最終表示更新 ${new Intl.DateTimeFormat("ja-JP", {
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit"
    }).format(new Date())}`;
}

function renderMilestones() {
  const examDate = parseLocalDate(state.examDate);
  const graduationDate = parseLocalDate(state.graduationDate);

  const examDays = document.getElementById("examDays");
  const graduationDays = document.getElementById("graduationDays");
  const examDateLabel = document.getElementById("examDateLabel");
  const graduationDateLabel = document.getElementById("graduationDateLabel");

  if (examDate) {
    examDays.textContent = String(Math.max(0, daysUntil(examDate)));
    examDateLabel.textContent = formatJapaneseDate(examDate);
  } else {
    examDays.textContent = "--";
    examDateLabel.textContent = "設定シートの日付をご確認ください";
  }

  if (graduationDate) {
    graduationDays.textContent = String(Math.max(0, daysUntil(graduationDate)));
    graduationDateLabel.textContent = formatJapaneseDate(graduationDate);
  } else {
    graduationDays.textContent = "--";
    graduationDateLabel.textContent = "設定シートの日付をご確認ください";
  }
}

function renderNotice() {
  const section = document.getElementById("noticeSection");
  const text = document.getElementById("noticeText");

  if (state.notice) {
    text.textContent = state.notice;
    section.classList.remove("hidden");
  } else {
    section.classList.add("hidden");
  }
}

async function loadTasks() {
  const taskList = document.getElementById("taskList");

  try {
    const data = await fetchGviz(TASK_SHEET_GID, 1);
    const tasks = [];

    for (const row of data.table.rows || []) {
      const name = cellValue(row.c?.[0]);
      const deadlineText = cellValue(row.c?.[1]);
      const deadline = parseLocalDate(deadlineText);

      if (!name || !deadline) continue;

      const remaining = daysUntil(deadline);
      if (remaining < 0) continue;

      tasks.push({ name, deadline, remaining });
    }

    tasks.sort((a, b) => a.deadline - b.deadline);

    if (tasks.length === 0) {
      taskList.innerHTML = '<div class="empty-state">現在、表示する提出物はありません。</div>';
      return;
    }

    taskList.innerHTML = tasks.map(task => {
      const statusClass = task.remaining <= 3 ? "urgent" : task.remaining <= 7 ? "warning" : "";
      return `
        <article class="task-card ${statusClass}">
          <div>
            <h3 class="task-name">${escapeHtml(task.name)}</h3>
            <p class="task-deadline">締切 ${escapeHtml(formatJapaneseDate(task.deadline))}</p>
          </div>
          <div class="task-remaining" aria-label="残り${task.remaining}日">
            <span class="task-number">${task.remaining}</span>
            <span class="task-unit">日</span>
          </div>
        </article>`;
    }).join("");
  } catch (error) {
    console.error(error);
    taskList.innerHTML = '<div class="error-card">提出物を読み込めませんでした。提出物シートの公開設定、gid、日付形式をご確認ください。</div>';
  }
}
</script>
</body>
</html>
