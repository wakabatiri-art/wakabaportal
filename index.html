<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>河野先生ポータル</title>

<style>
body{
    font-family:sans-serif;
    max-width:700px;
    margin:auto;
    padding:20px;
    background:#f5f5f5;
}

.card{
    background:white;
    padding:15px;
    margin:10px 0;
    border-radius:10px;
    box-shadow:0 2px 5px rgba(0,0,0,.1);
}

.red{
    border-left:8px solid #e53935;
}

.yellow{
    border-left:8px solid #fbc02d;
}

.green{
    border-left:8px solid #43a047;
}
</style>
</head>

<body>

<h1>📚 提出物カウントダウン</h1>

<div id="list"></div>

<script>

const tasks = [
  {
    name:"学習記録入力",
    deadline:"2026-09-15"
  },
  {
    name:"探究レポート",
    deadline:"2026-09-20"
  },
  {
    name:"模試振り返り",
    deadline:"2026-09-30"
  }
];

const list = document.getElementById("list");

tasks.forEach(task=>{

    const today = new Date();
    const deadline = new Date(task.deadline);

    const diff =
    Math.ceil(
    (deadline - today) /
    (1000*60*60*24)
    );

    let color = "green";

    if(diff <=3){
        color="red";
    }
    else if(diff <=7){
        color="yellow";
    }

    list.innerHTML += `
    <div class="card ${color}">
      <h2>${task.name}</h2>
      <p>締切 ${task.deadline}</p>
      <h3>あと ${diff} 日</h3>
    </div>
    `;
});

</script>

</body>
</html>
