<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WAKABAポータル</title>

<style>
body{
    font-family:sans-serif;
    max-width:800px;
    margin:auto;
    padding:20px;
    background:#f5f5f5;
}

.card{
    background:white;
    padding:15px;
    margin:10px 0;
    border-radius:10px;
    box-shadow:0 2px 5px rgba(0,0,0,.1);
}

.hidden{
    display:none;
}

input,button{
    padding:10px;
    margin:5px;
}

h1{
    text-align:center;
}
</style>
</head>
<body>

<div id="login">

<h1>🎓 WAKABAポータル</h1>

<div class="card">
<p>合言葉を入力してください</p>

<input type="password" id="pw">

<button onclick="checkPassword()">
入室
</button>

<p id="error" style="color:red;"></p>

</div>

</div>

<div id="main" class="hidden">

<h1>📚 提出物カウントダウン</h1>

<div id="list"></div>

</div>

<script>

const PASSWORD = "wakaba2026";

function checkPassword() {

    const pw = document.getElementById("pw").value;

    if(pw === PASSWORD){
        document.getElementById("login").classList.add("hidden");
        document.getElementById("main").classList.remove("hidden");
        loadTasks();
    }else{
        document.getElementById("error").innerText =
        "合言葉が違います";
    }
}

async function loadTasks(){

const sheetId =
"1aMZqKCpTziQJJeL30ijG9SN15gAnzdB6jwbxhrO8Kvw";

const url =
`https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json`;

const response = await fetch(url);

const text = await response.text();

const json =
JSON.parse(text.substring(47).slice(0,-2));

const rows = json.table.rows;

const list =
document.getElementById("list");

list.innerHTML = "";

rows.forEach(row=>{

const name = row.c[0]?.v;
const deadline = row.c[1]?.f || row.c[1]?.v;

if(!name || !deadline) return;

const today = new Date();
const limit = new Date(deadline);

const diff =
Math.ceil(
(limit-today)/(1000*60*60*24)
);

let color = "#43a047";

if(diff <= 3){
    color = "#e53935";
}
else if(diff <= 7){
    color = "#fbc02d";
}

if(diff >= 0){

list.innerHTML += `
<div class="card"
style="border-left:8px solid ${color}">
<h2>${name}</h2>
<p>締切：${deadline}</p>
<h3>あと ${diff} 日</h3>
</div>
`;

}

});

}

</script>

</body>
</html>
