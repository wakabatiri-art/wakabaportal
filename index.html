<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#651a2b"><title>WAKABA PORTAL</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet"><style>
:root{--m:#651a2b;--d:#45101d;--ink:#252126;--muted:#716b70;--line:#e5dfe1;--paper:#fff;--bg:#f5f2f3;--warn:#a66a18;--bad:#a52a2a;--shadow:0 12px 32px rgba(52,24,32,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"BIZ UDPGothic","BIZ UDゴシック",sans-serif}button,input{font:inherit}.hidden{display:none!important}.header{background:#fff;border-top:7px solid var(--m);border-bottom:1px solid var(--line)}.head{width:min(1080px,calc(100% - 40px));margin:auto;padding:25px 0;display:flex;justify-content:space-between;align-items:center;gap:20px}.logo{padding:0;border:0;background:none;color:var(--m);font-weight:700;font-size:clamp(1.55rem,5vw,2.1rem);letter-spacing:.1em;cursor:pointer}.tag{margin:6px 0 0;color:var(--muted);font-size:.86rem}.back{padding:9px 14px;border:1px solid var(--line);background:#fff;color:var(--m);font-weight:700;cursor:pointer}.main{width:min(1080px,calc(100% - 40px));margin:auto;padding:40px 0 70px}.section{margin-top:42px}.section:first-child{margin-top:0}.title{display:flex;align-items:center;gap:14px;margin:0 0 18px;color:var(--m);font-size:1.13rem}.title:after{content:"";flex:1;height:1px;background:var(--line)}.milestones,.pages{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.milestone{padding:28px;background:linear-gradient(145deg,var(--d),var(--m));color:#fff;box-shadow:var(--shadow)}.milestone:nth-child(even){background:linear-gradient(145deg,#3d3538,#665a5f)}.mname{margin:0;font-weight:700}.mcount{margin-top:22px;font-size:4rem;font-weight:700;line-height:1}.mdate{margin:14px 0 0;color:#e8dfe2;font-size:.83rem}.page{padding:23px;text-align:left;background:#fff;border:1px solid var(--line);border-top:4px solid var(--m);box-shadow:0 8px 24px rgba(52,24,32,.05);cursor:pointer}.page h3{margin:0;font-size:1.12rem}.page p{margin:9px 0 0;color:var(--muted);font-size:.84rem}.phead{padding-bottom:20px;border-bottom:1px solid var(--line)}.phead h2{margin:0;color:var(--m);font-size:1.8rem}.phead p{margin:7px 0 0;color:var(--muted)}.auth{max-width:470px;margin:25px auto 0;padding:32px;background:#fff;border:1px solid var(--line);border-top:5px solid var(--m);box-shadow:var(--shadow)}.auth h3,.auth p{text-align:center}.auth h3{margin:0;color:var(--m)}.auth p{color:var(--muted);font-size:.88rem}.auth label{display:block;margin:22px 0 8px;font-weight:700}.auth input{width:100%;padding:12px;border:1px solid #ccc}.auth button{width:100%;margin-top:15px;padding:12px;border:0;background:var(--m);color:#fff;font-weight:700;cursor:pointer}.msg{min-height:1.3em;color:var(--bad)!important}.notices,.tasks,.resources,.sites,.videos{display:grid;gap:11px}.notice,.task,.resource,.video{background:#fff;border:1px solid var(--line);box-shadow:0 7px 22px rgba(52,24,32,.045)}.notice{padding:22px 24px;border-left:5px solid var(--m)}.date{margin:0 0 7px;color:var(--muted);font-size:.8rem}.notice p:last-child{margin:0;font-size:1.12rem;line-height:1.8;white-space:pre-wrap}.new{display:inline-block;margin-right:7px;padding:3px 7px;background:var(--m);color:#fff;border-radius:3px;font-size:.7rem;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}.col{display:grid;gap:32px}.task{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;padding:19px 21px;border-left:5px solid var(--m)}.task.warn{border-left-color:var(--warn)}.task.bad{border-left-color:var(--bad)}.task h3,.resource h3{margin:0;font-size:1rem}.task .date{margin-top:7px}.days{color:var(--m);white-space:nowrap}.warn .days{color:var(--warn)}.bad .days{color:var(--bad)}.days b{font-size:2.2rem}.resource{padding:19px 21px}.desc{margin:8px 0 13px;color:var(--muted);font-size:.9rem;line-height:1.65}.open{display:inline-block;padding:8px 13px;border:1px solid var(--m);color:var(--m);font-size:.88rem;font-weight:700;text-decoration:none}.video{overflow:hidden}.frame{position:relative;aspect-ratio:16/9;background:#171315}.thumb{display:block;width:100%;height:100%;padding:0;border:0;background:#171315;cursor:pointer}.thumb img{display:block;width:100%;height:100%;object-fit:cover}.play{position:absolute;left:50%;top:50%;width:62px;height:44px;transform:translate(-50%,-50%);border-radius:10px;background:rgba(101,26,43,.95)}.play:after{content:"";position:absolute;left:25px;top:12px;border-top:10px solid transparent;border-bottom:10px solid transparent;border-left:16px solid #fff}.frame iframe{width:100%;height:100%;border:0}.vinfo{padding:17px 19px}.vinfo h3{margin:0;font-size:1rem}.vinfo p{margin:8px 0 0;color:var(--muted);font-size:.88rem;line-height:1.6}.loading,.empty,.error{padding:23px;background:#fff;border:1px solid var(--line);color:var(--muted);text-align:center}.error{color:var(--bad);border-left:5px solid var(--bad);text-align:left}.footer{padding:25px;border-top:1px solid var(--line);background:#eee9eb;color:var(--muted);text-align:center;font-size:.78rem}@media(max-width:720px){.head{align-items:flex-start;flex-direction:column}.milestones,.pages,.grid{grid-template-columns:1fr}.task{grid-template-columns:1fr}.main{width:min(100% - 28px,1080px);padding-top:28px}}
</style></head><body><header class="header"><div class="head"><div><button id="logo" class="logo">WAKABA PORTAL</button><p class="tag">授業・ホームルーム支援サイト</p></div><button id="back" class="back hidden">トップページへ</button></div></header><main class="main"><div id="home"><section class="section"><h2 class="title">大切な日まで</h2><div id="milestones" class="milestones"><div class="loading">読み込み中です。</div></div></section><section class="section"><h2 class="title">お知らせ</h2><div id="homeNotices" class="notices"><div class="loading">読み込み中です。</div></div></section><section class="section"><h2 class="title">ページ一覧</h2><div id="pages" class="pages"><div class="loading">読み込み中です。</div></div></section></div><div id="detail" class="hidden"><div class="phead"><h2 id="pageName"></h2><p>お知らせ・提出物・資料</p></div><section id="auth" class="auth"><h3>合言葉の入力</h3><p>このページの合言葉を入力してください。</p><label for="pw">合言葉</label><input id="pw" type="text" autocomplete="off"><button id="unlock">ページを開く</button><p id="msg" class="msg"></p></section><div id="content" class="hidden"><section id="noticeSec" class="section"><h2 class="title">お知らせ</h2><div id="notices" class="notices"></div></section><div class="section grid"><div class="col"><section id="taskSec"><h2 class="title">提出物</h2><div id="tasks" class="tasks"></div></section><section id="resourceSec"><h2 class="title">資料</h2><div id="resources" class="resources"></div></section></div><div class="col"><section id="siteSec"><h2 class="title">おすすめサイト</h2><div id="sites" class="sites"></div></section><section id="videoSec"><h2 class="title">おすすめ動画</h2><div id="videos" class="videos"></div></section></div></div></div></div></main><footer class="footer">個人運営の学習支援ページです。学校公式サイトではありません。</footer><script>
"use strict";const SID="1aMZqKCpTziQJJeL30ijG9SN15gAnzdB6jwbxhrO8Kvw",G={days:"402688501",pages:"1759134828",notices:"1027056613",tasks:"0",resources:"2055490412"},H24=86400000,state={pages:[],page:null},$=x=>document.getElementById(x);function url(g,h=1){return`https://docs.google.com/spreadsheets/d/${SID}/gviz/tq?gid=${g}&headers=${h}&tqx=out:json`}async function rows(g,h=1){const r=await fetch(url(g,h),{cache:"no-store"}),t=await r.text(),a=t.indexOf("{"),b=t.lastIndexOf("}");if(!r.ok||a<0||b<0)throw Error("read");return JSON.parse(t.slice(a,b+1)).table.rows||[]}function val(c){return c?.f!=null?String(c.f).trim():c?.v!=null?String(c.v).trim():""}function esc(x){return String(x).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}function date(x){let m=String(x).match(/^Date\((\d+),(\d+),(\d+)\)$/);if(m)return new Date(+m[1],+m[2],+m[3]);m=String(x).match(/(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/);return m?new Date(+m[1],+m[2]-1,+m[3]):null}function today(){const n=new Date;return new Date(n.getFullYear(),n.getMonth(),n.getDate())}function diff(d){return Math.ceil((d-today())/86400000)}function fmt(d){return new Intl.DateTimeFormat("ja-JP",{year:"numeric",month:"long",day:"numeric",weekday:"short"}).format(d)}function pub(x){return String(x).replace(/[\s　]/g,"")==="公開"}function fresh(d){if(!d)return false;const a=Math.floor((today()-d)/86400000);return a>=0&&a<=2}function badge(d){return fresh(d)?'<span class="new">新着</span>':""}async function hash(x){const h=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(x));return[...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join("")}async function valid(p){try{const x=JSON.parse(localStorage.getItem("wp:"+p.id));return x&&Date.now()<x.until&&x.sig===await hash(p.password)}catch{return false}}async function save(p){localStorage.setItem("wp:"+p.id,JSON.stringify({until:Date.now()+H24,sig:await hash(p.password)}))}async function loadDays(){try{const a=[];for(const r of await rows(G.days)){const n=val(r.c?.[0]),d=date(val(r.c?.[1]));if(n&&d&&diff(d)>=0)a.push({n,d})}a.sort((x,y)=>x.d-y.d);$("milestones").innerHTML=a.length?a.map(x=>`<article class="milestone"><p class="mname">${esc(x.n)}まで</p><div class="mcount">${diff(x.d)}<small> 日</small></div><p class="mdate">${fmt(x.d)}</p></article>`).join(""):'<div class="empty">表示する日程はありません。</div>'}catch{$("milestones").innerHTML='<div class="error">日程を読み込めませんでした。</div>'}}async function loadPages(){try{for(const r of await rows(G.pages)){const p={id:val(r.c?.[0]),name:val(r.c?.[1]),password:val(r.c?.[2]),order:+val(r.c?.[3])||999};if(p.id&&p.name&&p.password)state.pages.push(p)}state.pages.sort((a,b)=>a.order-b.order);$("pages").innerHTML=state.pages.map(p=>`<button class="page" data-id="${esc(p.id)}"><h3>${esc(p.name)}</h3><p>ページを開く</p></button>`).join("");document.querySelectorAll(".page").forEach(b=>b.onclick=()=>openPage(b.dataset.id))}catch{$("pages").innerHTML='<div class="error">ページ一覧を読み込めませんでした。</div>'}}async function noticeData(id){const a=[];for(const r of await rows(G.notices)){if(val(r.c?.[0])!==id||!pub(val(r.c?.[3])))continue;const t=val(r.c?.[1]),d=date(val(r.c?.[2]));if(t)a.push({t,d})}return a.sort((x,y)=>(y.d||0)-(x.d||0))}function noticeHtml(a){return a.map(x=>`<article class="notice">${x.d?`<p class="date">${badge(x.d)}${fmt(x.d)}</p>`:""}<p>${esc(x.t)}</p></article>`).join("")}async function loadHomeNotices(){try{const a=await noticeData("home");$("homeNotices").innerHTML=a.length?noticeHtml(a):'<div class="empty">現在、お知らせはありません。</div>'}catch{$("homeNotices").innerHTML='<div class="error">お知らせを読み込めませんでした。</div>'}}async function openPage(id){state.page=state.pages.find(x=>x.id===id);if(!state.page)return;$("home").classList.add("hidden");$("detail").classList.remove("hidden");$("back").classList.remove("hidden");$("pageName").textContent=state.page.name;$("pw").value="";$("msg").textContent="";if(await valid(state.page)){show();loadAll()}else{$("auth").classList.remove("hidden");$("content").classList.add("hidden")}history.replaceState(null,"","?page="+encodeURIComponent(id));scrollTo(0,0)}function home(){$("detail").classList.add("hidden");$("home").classList.remove("hidden");$("back").classList.add("hidden");history.replaceState(null,"",location.pathname);scrollTo(0,0)}function show(){$("auth").classList.add("hidden");$("content").classList.remove("hidden")}async function unlock(){if($("pw").value!==state.page.password){$("msg").textContent="合言葉が違います。";return}await save(state.page);show();loadAll()}async function loadAll(){await Promise.all([loadNotices(),loadTasks(),loadResources()])}async function loadNotices(){try{const a=await noticeData(state.page.id);if(a.length){$("noticeSec").classList.remove("hidden");$("notices").innerHTML=noticeHtml(a)}else $("noticeSec").classList.add("hidden")}catch{$("noticeSec").classList.add("hidden")}}async function loadTasks(){try{const a=[];for(const r of await rows(G.tasks)){if(val(r.c?.[0])!==state.page.id||!pub(val(r.c?.[3])))continue;const n=val(r.c?.[1]),d=date(val(r.c?.[2]));if(n&&d&&diff(d)>=0)a.push({n,d})}a.sort((x,y)=>x.d-y.d);if(!a.length){$("taskSec").classList.add("hidden");return}$("taskSec").classList.remove("hidden");$("tasks").innerHTML=a.map(x=>`<article class="task ${diff(x.d)<=3?'bad':diff(x.d)<=7?'warn':''}"><div><h3>${esc(x.n)}</h3><p class="date">締切 ${fmt(x.d)}</p></div><div class="days"><b>${diff(x.d)}</b> 日</div></article>`).join("")}catch{$("taskSec").classList.add("hidden")}}function ytid(u){try{const x=new URL(u);if(x.hostname==="youtu.be")return x.pathname.split("/")[1];if(x.pathname==="/watch")return x.searchParams.get("v");return x.pathname.match(/^\/(?:shorts|embed)\/([^/?]+)/)?.[1]||""}catch{return""}}function play(b){const id=b.dataset.id;b.parentElement.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?autoplay=1" title="YouTube動画" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`}async function loadResources(){try{const docs=[],sites=[],videos=[];for(const r of await rows(G.resources)){if(val(r.c?.[0])!==state.page.id||!pub(val(r.c?.[4])))continue;const x={n:val(r.c?.[1]),desc:val(r.c?.[2]),url:val(r.c?.[3]),d:date(val(r.c?.[5])),type:val(r.c?.[6])||"資料"};if(!x.n||!/^https?:\/\//.test(x.url))continue;if(x.type==="おすすめサイト")sites.push(x);else if(x.type==="YouTube"){x.id=ytid(x.url);if(x.id)videos.push(x)}else docs.push(x)}for(const a of[docs,sites,videos])a.sort((x,y)=>(y.d||0)-(x.d||0));if(docs.length){$("resourceSec").classList.remove("hidden");$("resources").innerHTML=docs.map(x=>`<article class="resource"><h3>${badge(x.d)}${esc(x.n)}</h3>${x.desc?`<p class="desc">${esc(x.desc)}</p>`:""}<a class="open" href="${esc(x.url)}" target="_blank" rel="noopener">資料を開く</a></article>`).join("")}else $("resourceSec").classList.add("hidden");if(sites.length){$("siteSec").classList.remove("hidden");$("sites").innerHTML=sites.map(x=>`<article class="resource"><h3>${badge(x.d)}${esc(x.n)}</h3>${x.desc?`<p class="desc">${esc(x.desc)}</p>`:""}<a class="open" href="${esc(x.url)}" target="_blank" rel="noopener">サイトを開く</a></article>`).join("")}else $("siteSec").classList.add("hidden");if(videos.length){$("videoSec").classList.remove("hidden");$("videos").innerHTML=videos.map(x=>`<article class="video"><div class="frame"><button class="thumb" data-id="${esc(x.id)}" aria-label="${esc(x.n)}を再生"><img src="https://i.ytimg.com/vi/${esc(x.id)}/hqdefault.jpg" alt="${esc(x.n)}のサムネイル" loading="lazy"><span class="play"></span></button></div><div class="vinfo"><h3>${badge(x.d)}${esc(x.n)}</h3>${x.desc?`<p>${esc(x.desc)}</p>`:""}</div></article>`).join("");document.querySelectorAll(".thumb").forEach(b=>b.onclick=()=>play(b))}else $("videoSec").classList.add("hidden")}catch{for(const x of["resourceSec","siteSec","videoSec"])$(x).classList.add("hidden")}}$("logo").onclick=home;$("back").onclick=home;$("unlock").onclick=unlock;$("pw").onkeydown=e=>{if(e.key==="Enter")unlock()};(async()=>{await Promise.all([loadDays(),loadHomeNotices(),loadPages()]);const id=new URLSearchParams(location.search).get("page");if(id)openPage(id)})();
</script></body></html>
